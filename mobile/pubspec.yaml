name: kiddoquest
description: "KiddoQuest — Kenyan CBC early-learning adventures for phones, tablets and Android TV."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

# Versions are pinned in pubspec.lock. Constraints are deliberately loose here so
# a fresh checkout on a slow connection resolves rather than fighting the solver.
dependencies:
  flutter:
    sdk: flutter

  # State and navigation
  flutter_riverpod:
  go_router:

  # Network
  dio:

  # Local storage: the child plays entirely from this while offline
  sqflite:
  path:
  path_provider:
  # Pinned below 10: newer releases require compileSdk 37, and this project
  # targets 36. See the Android SDK note in README.md.
  flutter_secure_storage: ^9.2.4

  # Platform
  connectivity_plus:
  device_info_plus:
  package_info_plus:

  # Sound and speech. A three-year-old cannot read the question, so the app
  # reads it to them: a recorded narration when the pack carries one, the
  # device voice when it does not.
  just_audio:
  audio_session:
  flutter_tts:
  speech_to_text:

  # Mission intro videos
  video_player:

  # Practice reminders. These are scheduled on the device, so they arrive
  # whether or not the family has a connection.
  flutter_local_notifications:
  timezone:

  # Utilities
  crypto:
  uuid:
  collection:
  intl:
  sqflite_common_ffi_web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints:

flutter:
  uses-material-design: true
