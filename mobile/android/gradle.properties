# The Flutter template asks Gradle for an 8 GB heap and 4 GB of metaspace, which
# is more than an 8 GB development machine has to give. Two gigabytes builds this
# project comfortably; raise it if you build on something larger.
#
# The heap is not the only limit on a small machine. Four builds were killed here
# by the operating system with an editor and a browser open, at heap sizes from
# 8 G down to 1 G. Close them, or build in CI.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m

# Parallel workers each take their own heap, which is the wrong trade when
# memory is the scarce resource rather than cores.
org.gradle.parallel=false
org.gradle.caching=true

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
